<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Agenda CONDELPI</title>

  <!-- Configuración PWA para iOS (iPhone/iPad) y Android -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CONDELPI">
  <meta name="theme-color" content="#0f172a">

  <!-- Icono para pantalla de inicio móvil (Sube tu imagen como logo.png al mismo repositorio) -->
  <link rel="apple-touch-icon" href="logo.png">
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0f172a;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>
  <!-- Aplicación publicada en Google Apps Script -->
  <iframe 
    id="appFrame"
    src="https://script.google.com/macros/s/AKfycbzyIIRBrqUeTOslxJLy6oYJxz8RQNIhLjNcpBdqnGCWx0Vy80rtKOOTd77_pHqdxWxD1A/exec" 
    allow="clipboard-read; clipboard-write; geolocation">
  </iframe>

  <script>
    // Permite pasar parámetros como ?v=panel desde la URL de GitHub hacia Apps Script
    const params = window.location.search;
    if (params) {
      const frame = document.getElementById('appFrame');
      frame.src = frame.src.split('?')[0] + params;
    }
  </script>
</body>
</html>
