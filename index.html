<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="CONDELPI">
  <meta name="apple-touch-icon" href="logo.png">
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="manifest" href="manifest.json">
  <title>Agenda CONDELPI</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #0f172a;
      color: #e2e8f0;
      font: 16px/1.55 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      width: min(100%, 560px);
      padding: clamp(24px, 6vw, 42px);
      text-align: center;
      background: #172033;
      border: 1px solid #334155;
      border-radius: 20px;
      box-shadow: 0 24px 80px rgb(0 0 0 / 28%);
    }
    .mark {
      width: 72px; height: 72px; margin: 0 auto 22px;
      display: grid; place-items: center;
      border-radius: 18px; background: #24324a;
      font-size: 32px;
    }
    h1 { margin: 0 0 10px; font-size: clamp(26px, 5vw, 34px); line-height: 1.2; }
    p { margin: 0 0 22px; color: #cbd5e1; }
    .note {
      margin: 20px 0 0; font-size: 13px; color: #94a3b8;
    }
    a.button {
      display: inline-flex; justify-content: center; align-items: center;
      width: 100%; min-height: 52px; padding: 14px 20px;
      border-radius: 10px; background: #38bdf8; color: #082f49;
      text-decoration: none; font-weight: 750;
      transition: background .15s ease, transform .15s ease;
    }
    a.button:hover { background: #7dd3fc; transform: translateY(-1px); }
    a.button:focus-visible { outline: 3px solid #f8fafc; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">📋</div>
    <h1>Agenda CONDELPI</h1>
    <p>CRM para la gestión de vehículos y viviendas.</p>
    <a
      class="button"
      href="https://script.google.com/macros/s/AKfycbzyIIRBrqUeTOslxJLy6oYJxz8RQNIhLjNcpBdqnGCWx0Vy80rtKOOTd77_pHqdxWxD1A/exec"
      target="_blank"
      rel="noopener noreferrer"
    >Abrir aplicación</a>
    <p class="note">La aplicación se abrirá en una pestaña nueva para evitar el bloqueo de seguridad de Google Apps Script en marcos incrustados.</p>
  </main>
</body>
</html>
