<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="CONDELPI">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-touch-icon" href="logo.png">
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="manifest" href="manifest.json">
  <title>Agenda CONDELPI</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0f172a;
    }
    #app-shell {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: #0f172a;
    }
    #appFrame {
      display: block;
      width: 100%;
      height: 100%;
      min-height: 100%;
      border: 0;
      margin: 0;
      padding: 0;
      background: #0f172a;
    }
    #fallback {
      position: fixed;
      z-index: 2;
      right: 12px;
      bottom: 12px;
      padding: 9px 12px;
      border-radius: 8px;
      color: #082f49;
      background: #38bdf8;
      font: 600 14px/1.25 system-ui, sans-serif;
      text-decoration: none;
      box-shadow: 0 4px 18px rgb(0 0 0 / 25%);
    }
  </style>
</head>
<body>
  <main id="app-shell" aria-label="Agenda CONDELPI">
    <iframe
      id="appFrame"
      src="https://script.google.com/macros/s/AKfycbzZC9zWRiVMUijCYsvo10Nly5zPrZDJHS14fS2IKfS2z5HIYhHJSXHZvnwR-yhVUOT-5w/exec"
      title="Agenda CONDELPI"
      allow="clipboard-read; clipboard-write; geolocation; fullscreen"
      allowfullscreen
      scrolling="yes"
      referrerpolicy="strict-origin-when-cross-origin">
    </iframe>
  </main>

  <a
    id="fallback"
    href="https://script.google.com/macros/s/AKfycbzZC9zWRiVMUijCYsvo10Nly5zPrZDJHS14fS2IKfS2z5HIYhHJSXHZvnwR-yhVUOT-5w/exec"
    target="_blank"
    rel="noopener noreferrer"
    aria-label="Abrir Agenda CONDELPI en una pestaña nueva">
    Abrir fuera del marco
  </a>

  <script>
    // Conserva parámetros de la URL de GitHub Pages y los transmite a Apps Script.
    const frame = document.getElementById('appFrame');
    const appUrl = new URL(frame.src);
    const incoming = new URLSearchParams(window.location.search);
    incoming.forEach((value, key) => appUrl.searchParams.set(key, value));
    frame.src = appUrl.toString();
  </script>
</body>
</html>
