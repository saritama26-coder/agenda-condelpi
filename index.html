<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="CONDELPI">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <title>Agenda CONDELPI</title>
  <style>
    :root {
      color-scheme: dark;
      --navy: #0f172a;
      --panel: #172238;
      --text: #f8fafc;
      --muted: #cbd5e1;
      --accent: #38bdf8;
      --accent-ink: #082f49;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-width: 0;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: var(--navy);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-text-size-adjust: 100%;
    }
    #app-shell {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: var(--navy);
    }
    #appFrame {
      display: block;
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 100%;
      border: 0;
      margin: 0;
      padding: 0;
      background: var(--navy);
    }
    #fallback {
      position: fixed;
      z-index: 5;
      right: max(12px, env(safe-area-inset-right));
      bottom: max(12px, env(safe-area-inset-bottom));
      padding: 10px 13px;
      border-radius: 9px;
      color: var(--accent-ink);
      background: var(--accent);
      font: 650 14px/1.25 system-ui, sans-serif;
      text-decoration: none;
      box-shadow: 0 4px 18px rgb(0 0 0 / 25%);
    }
    #mobile-launch {
      display: none;
      min-height: 100%;
      min-height: 100dvh;
      width: 100%;
      padding:
        max(28px, env(safe-area-inset-top))
        max(22px, env(safe-area-inset-right))
        max(28px, env(safe-area-inset-bottom))
        max(22px, env(safe-area-inset-left));
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(ellipse at top, rgb(56 189 248 / 14%), transparent 55%),
        var(--navy);
    }
    .mobile-card {
      width: 100%;
      max-width: 440px;
      margin: auto;
      padding: 28px 22px;
      border: 1px solid rgb(148 163 184 / 25%);
      border-radius: 18px;
      background: rgb(23 34 56 / 96%);
      text-align: center;
      box-shadow: 0 18px 48px rgb(0 0 0 / 22%);
    }
    .app-mark {
      display: grid;
      width: 62px;
      height: 62px;
      margin: 0 auto 18px;
      place-items: center;
      border-radius: 16px;
      color: var(--accent-ink);
      background: var(--accent);
      font-size: 25px;
      font-weight: 850;
      letter-spacing: -1px;
    }
    .mobile-card h1 {
      margin: 0 0 10px;
      color: var(--text);
      font-size: clamp(22px, 6vw, 29px);
      line-height: 1.2;
      letter-spacing: -0.5px;
    }
    .mobile-card p {
      margin: 0 0 22px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.55;
    }
    .primary-link {
      display: flex;
      width: 100%;
      min-height: 50px;
      padding: 13px 18px;
      align-items: center;
      justify-content: center;
      border-radius: 11px;
      color: var(--accent-ink);
      background: var(--accent);
      font-size: 16px;
      font-weight: 750;
      text-decoration: none;
      touch-action: manipulation;
    }
    .hint {
      display: block;
      margin-top: 14px;
      color: #94a3b8;
      font-size: 12px;
      line-height: 1.45;
    }
    @media (max-width: 768px), (pointer: coarse) {
      #app-shell, #fallback { display: none; }
      #mobile-launch { display: flex; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <main id="mobile-launch" aria-label="Acceso móvil a Agenda CONDELPI">
    <section class="mobile-card">
      <div class="app-mark" aria-hidden="true">C</div>
      <h1>Agenda CONDELPI</h1>
      <p>Abre la aplicación directamente para usarla en tu teléfono, aprovechar toda la pantalla y evitar restricciones de carga dentro de un marco.</p>
      <a class="primary-link" id="mobile-open" href="https://script.google.com/macros/s/AKfycbzZC9zWRiVMUijCYsvo10Nly5zPrZDJHS14fS2IKfS2z5HIYhHJSXHZvnwR-yhVUOT-5w/exec">Abrir versión móvil</a>
      <span class="hint">Si la aplicación no se abre automáticamente, toca el botón para continuar.</span>
    </section>
  </main>

  <main id="app-shell" aria-label="Agenda CONDELPI">
    <iframe
      id="appFrame"
      src="https://script.google.com/macros/s/AKfycbzZC9zWRiVMUijCYsvo10Nly5zPrZDJHS14fS2IKfS2z5HIYhHJSXHZvnwR-yhVUOT-5w/exec"
      title="Agenda CONDELPI"
      allow="clipboard-read; clipboard-write; geolocation; fullscreen"
      allowfullscreen
      scrolling="yes"
      referrerpolicy="strict-origin-when-cross-origin">
    </iframe>
  </main>

  <a id="fallback"
    href="https://script.google.com/macros/s/AKfycbzZC9zWRiVMUijCYsvo10Nly5zPrZDJHS14fS2IKfS2z5HIYhHJSXHZvnwR-yhVUOT-5w/exec"
    target="_blank"
    rel="noopener noreferrer"
    aria-label="Abrir Agenda CONDELPI en una pestaña nueva">
    Abrir fuera del marco
  </a>

  <script>
    (() => {
      const appUrl = new URL("https://script.google.com/macros/s/AKfycbzZC9zWRiVMUijCYsvo10Nly5zPrZDJHS14fS2IKfS2z5HIYhHJSXHZvnwR-yhVUOT-5w/exec");
      const incoming = new URLSearchParams(window.location.search);
      incoming.forEach((value, key) => appUrl.searchParams.set(key, value));

      // En móviles se evita el iframe: Apps Script puede bloquear la incrustación
      // y la aplicación necesita abrirse como documento de primer nivel.
      const isMobile = window.matchMedia("(max-width: 768px), (pointer: coarse)").matches;
      document.getElementById("mobile-open").href = appUrl.toString();

      if (isMobile) {
        window.location.replace(appUrl.toString());
      } else {
        document.getElementById("appFrame").src = appUrl.toString();
      }
    })();
  </script>
  <noscript>
    <style>
      #app-shell, #fallback { display: none !important; }
      #mobile-launch { display: flex !important; }
    </style>
  </noscript>
</body>
</html>
